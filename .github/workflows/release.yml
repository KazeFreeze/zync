name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
  plugin-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:plugin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" packages/plugin/main.js packages/plugin/manifest.json packages/plugin/styles.css packages/plugin/versions.json --clobber
  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # release-please tags releases as `zync-v1.2.3`. docker/metadata-action's `type=semver`
      # cannot parse that prefix, so it silently emitted NO version tag and the image only ever
      # got `:latest`. That left no way to pin a deployment to an exact build - which matters,
      # because a floating tag is precisely what let production sit two weeks behind while
      # deploys reported success. Strip the prefix explicitly rather than relying on pattern
      # matching that fails quietly.
      - id: ver
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          v="${TAG#zync-}"
          case "$v" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected tag shape: $TAG" >&2; exit 1 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=${{ steps.ver.outputs.v }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
